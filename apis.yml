aid: converge-bio
name: Converge Bio
description: 'Converge Bio is a generative-AI platform for life sciences that accelerates drug development
  across discovery, molecular design, and manufacturing. It trains Bio-LLM foundation models directly on
  biological languages (DNA, RNA, and protein sequences) and delivers them through the Converge Computational
  Lab, whose applications include ConvergeAB (AI antibody design across IgG/VHH/bispecific formats),
  ConvergeGEO (protein gene-expression optimization across CHO/HEK293/E. coli and other cell systems),
  ConvergeCELL (virtual cell simulation for target and biomarker discovery), and a Patent Extractor for
  mining antibody sequences. The platform is delivered to biotech and pharmaceutical customers under a
  Request Access engagement model; there is no public developer API, SDK, or self-serve documentation
  surface today. Backed by Bessemer Venture Partners ($25M Series A, January 2026); founded 2023.'
